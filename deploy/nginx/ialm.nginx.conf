# IALM nginx location 块（与 4 模块风格一致）
# 加入主 nginx server block: include /etc/nginx/conf.d/ialm.conf;

# 1. 前端静态资源
location /ialm/assets/ {
    alias /var/www/ialm/assets/;
    expires 7d;
    access_log off;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# 2. 前端 SPA 路由
location /ialm/ {
    alias /var/www/ialm/;
    try_files $uri $uri/ /ialm/index.html;
    index index.html;
}

# 3. 后端 API（去 /ialm 前缀）
location /ialm/api/ {
    proxy_pass http://127.0.0.1:8004/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}